# Local DEVELOPMENT database for `npm run start:dev` and the e2e tests (not part of the Docker stack). Reads DB_* and
# PGADMIN_* from backend/.env. Its own project ("backend") and volume: it never shares data with the stack.
#   docker compose -f docker-compose.dev.yml up -d                    -> PostgreSQL on 127.0.0.1:${DB_PORT}
#   docker compose -f docker-compose.dev.yml --profile tools up -d    -> + pgAdmin (http://localhost:5050)
# Same image as the stack's database (../database/Dockerfile: PostgreSQL 16, UTC, health check).
services:
  db:
    build: ../database
    container_name: clinic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-clinic_db}
      POSTGRES_USER: ${DB_USERNAME:-clinic_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pg16_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:9
    profiles: [tools]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg16_data:
